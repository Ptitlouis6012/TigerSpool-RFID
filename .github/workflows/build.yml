# Build the firmware, and check that the documentation has not rotted.
#
# Runs on every branch, not only main. A build that only runs once a branch is
# already proposed for merge tells you too late.

name: build

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guards:
    name: guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The guards read the font range from a committed fact, so they no
      # longer need this to run. CI installs the library anyway, because this
      # is where check-generated.py re-derives that fact from LVGL's own font
      # source and proves it has not gone stale. A fresh clone skips the check
      # and says so; CI is what keeps it honest.
      - name: Fetch library sources
        run: |
          pip install --upgrade platformio
          cd firmware && pio pkg install -e tigerspool

      # One command, the same one the bench runs. A check that lives inside a
      # workflow can only be run by pushing.
      - name: Run the guards
        run: bash scripts/verify.sh --quick

  firmware:
    name: build firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build
        working-directory: firmware
        run: pio run -e tigerspool

      - name: Report size
        working-directory: firmware
        run: |
          # The app partition is 4 MB (partitions.csv). Printing the numbers on
          # every build is how a slow creep towards the ceiling gets noticed
          # before it is a release-day problem.
          pio run -e tigerspool 2>&1 | grep -E 'RAM:|Flash:' || true

      - name: The version macro is the single source of truth
        run: bash scripts/check-version.sh

      - uses: actions/upload-artifact@v4
        with:
          name: tigerspool-${{ github.sha }}
          path: |
            firmware/.pio/build/tigerspool/firmware.bin
            firmware/.pio/build/tigerspool/partitions.bin
          retention-days: 30
