# Publish a release.
#
#     git tag v1.0.0 && git push origin v1.0.0
#
# PLACEHOLDER — no firmware to release yet. Everything below is commented, but
# the design is settled and documented in docs/OTA.md.
#
# Two rules this workflow exists to enforce, once it is enabled:
#
#   1. ONE source of truth for the version — a macro in the firmware source. The
#      workflow refuses to publish if the git tag disagrees with it.
#   2. The manifest is GENERATED, never hand-edited. The OTA channel and the web
#      installer read the same generated file, which is what stops them drifting
#      apart because someone forgot a step.
#
# Prerequisite, once: Settings -> Pages -> Source = "GitHub Actions".
# Prerequisite for signing: a signing key in repository secrets. Never in git.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  placeholder:
    runs-on: ubuntu-latest
    steps:
      - name: Not yet implemented
        run: |
          echo "There is no firmware in this repository yet."
          echo "See docs/MIGRATION.md for the plan, docs/OTA.md for the release design."
          exit 1

