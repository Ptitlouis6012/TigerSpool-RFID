# Deploy the web installer to GitHub Pages.
#
# PLACEHOLDER — installer/ has a README and no page yet. See installer/README.md.
#
# When enabled, this deploys installer/ together with the firmware binaries built
# by release.yml. Binaries are NEVER committed to the repository: they exist only
# in the deployed Pages artifact and in the GitHub release, so the installer and
# the OTA channel cannot serve different builds.
#
# Prerequisite, once: Settings -> Pages -> Source = "GitHub Actions".

name: pages

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

